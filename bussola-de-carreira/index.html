<style>
*{box-sizing:border-box}
:root{--paper:#f1f1ef;--surface:#fff;--sunk:#e7e8e6;--ink:#262726;--ink-2:#575756;--ink-3:#6f716f;--line:#cfd1cf;--accent:#f39200;--accent-ink:#9a5a00;--good:#17783f;
 --fd:"Barlow Condensed","Arial Narrow",sans-serif;--fb:"Barlow","Segoe UI",system-ui,sans-serif;--fm:"IBM Plex Mono",ui-monospace,Menlo,monospace}
body{margin:0;background:var(--paper);color:var(--ink);font:400 17px/1.5 var(--fb)}
h1,h2,h3{font-family:var(--fd);font-weight:600;letter-spacing:.01em;line-height:1.12;margin:0;text-wrap:balance}
a{color:var(--accent-ink)}
header{background:var(--ink);color:#fff}
.top{max-width:980px;margin:0 auto;padding:14px 20px;display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.brand{display:flex;gap:12px;align-items:center}.brand b{font:700 26px/1 var(--fd);letter-spacing:.08em}.brand b i{font-style:normal;color:var(--accent)}
.brand span{font:500 13px var(--fd);letter-spacing:.14em;text-transform:uppercase;color:#c9cbc9}
.wrap{max-width:980px;margin:0 auto;padding:26px 20px 60px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:0 1px 2px rgba(30,32,30,.08),0 8px 22px rgba(30,32,30,.06)}
.pad{padding:24px}
.tag{font:600 13px/1 var(--fd);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
.btn{font:600 18px/1 var(--fd);letter-spacing:.07em;text-transform:uppercase;border:1px solid var(--ink-2);background:var(--surface);color:var(--ink);padding:13px 20px;border-radius:5px;cursor:pointer;text-decoration:none;display:inline-block}
.btn:hover{background:var(--sunk)}.btn.primary{background:var(--accent);border-color:var(--accent);color:#1d1300}.btn.primary:hover{filter:brightness(1.05)}.btn.small{font-size:15px;padding:9px 13px}
.hero{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:28px;align-items:center}@media (max-width:760px){.hero{grid-template-columns:1fr}}

.idle #needle{animation:wob 5s ease-in-out infinite}@keyframes wob{0%,100%{transform:rotate(-28deg)}25%{transform:rotate(40deg)}55%{transform:rotate(-70deg)}80%{transform:rotate(15deg)}}
@media (prefers-reduced-motion:reduce){.idle #needle{animation:none}#needle{transition:none}}
.prog{height:6px;background:var(--sunk);border-radius:3px;overflow:hidden;margin:10px 0 22px}.prog i{display:block;height:100%;background:var(--accent);transition:width .3s}
.q h2{font-size:clamp(26px,3.6vw,34px);margin:8px 0 6px}.q .sub{color:var(--ink-3);margin:0 0 18px}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}@media (max-width:640px){.opts{grid-template-columns:1fr}}
.opt{font:500 17px/1.3 var(--fb);text-align:left;border:2px solid var(--line);background:var(--surface);color:var(--ink);padding:14px 16px;border-radius:7px;cursor:pointer;display:flex;flex-direction:column;gap:3px}
.opt:hover,.opt:focus-visible{border-color:var(--accent);background:#fff8e6;outline:none}.opt small{color:var(--ink-3);font-size:14px}
.nav{display:flex;justify-content:space-between;align-items:center;margin-top:20px}
.res-top{display:grid;grid-template-columns:150px minmax(0,1fr);gap:22px;align-items:center}@media (max-width:640px){.res-top{grid-template-columns:1fr}}

.norte h2{font-size:clamp(28px,4vw,38px);margin:6px 0 8px}
.price{font:600 17px var(--fm);white-space:nowrap}
.why{margin:10px 0 16px;padding-left:20px}.why li{margin-bottom:5px}
.rota{list-style:none;padding:0;margin:14px 0 0;display:grid;gap:10px}
.rota li{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:14px;align-items:center;border:1px solid var(--line);border-radius:7px;padding:12px 14px;background:var(--surface)}
@media (max-width:640px){.rota li{grid-template-columns:44px minmax(0,1fr)}.rota li .price{grid-column:2}}
.rota li>b{width:40px;height:40px;border-radius:50%;background:var(--ink);color:#fff;font:700 20px/40px var(--fd);text-align:center}
.rota li.main>b{background:var(--accent);color:#1d1300}.rota strong{display:block;font-size:18px}.rota span.d{color:var(--ink-3);font-size:14.5px}
.alt{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:14px}@media (max-width:640px){.alt{grid-template-columns:1fr}}
.alt div{border:1px dashed var(--ink-3);border-radius:7px;padding:12px 14px;font-size:15.5px}
.note{font-size:13.5px;color:var(--ink-3)}
.escada{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0;margin:16px 0 4px;counter-reset:d}
@media (max-width:640px){.escada{grid-template-columns:1fr}}
.deg{position:relative;padding:12px 14px 12px 18px;border:1px solid var(--line);background:var(--surface);font-size:15.5px;line-height:1.3}
.deg small{display:block;font:600 12px var(--fd);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);margin-bottom:3px}
.deg.voce{background:var(--ink);color:#fff;border-color:var(--ink)}.deg.voce small{color:#ffd08a}
.deg.alvo{background:#fff8e6;border:2px solid var(--accent)}

.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}.chips span{font:600 13px var(--fm);background:var(--sunk);border-radius:4px;padding:4px 8px}
.acts{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}
@media print{header,.acts,.nav{display:none}body{background:#fff}.card{box-shadow:none;border:0}}
</style>

  var horas=t.c.reduce(function(a,k){return a+(K[k][3]||0)},0),semanas=Math.ceil(horas/hs);
  var main,tipo;
  if(b==='b0'){main=K.yb&&R.trilha!=='vaga'&&R.trilha!=='lid'&&R.trilha!=='dados'&&R.trilha!=='proj'&&!temBase?{n:K.yb[0],p:'grátis',u:''}:{n:K[primeiro][0],p:K[primeiro][2]||'a confirmar',u:K[primeiro][1]?U+K[primeiro][1]:''};tipo=main.p==='grátis'?'gratis':'curso'}
  else if(b==='b1'){main={n:K[primeiro][0],p:K[primeiro][2]||'a confirmar',u:K[primeiro][1]?U+K[primeiro][1]:''};tipo='curso'}
  else if(b==='b2'){if(t.mba==='gp'&&hs>2&&nivel>0){main={n:MBA.gp[0],p:MBA.gp[1],u:''};tipo='mba'}else{var ck=temBase&&t.cert==='gb'?'bb':t.cert;if(ck===primeiro||K[ck][2].indexOf('R$ 4')<0&&K[ck][2].indexOf('R$ 5')<0&&K[ck][2].indexOf('R$ 6')<0){main={n:t.f,p:'preço a confirmar',u:''};tipo='formacao'}else{main={n:K[ck][0],p:K[ck][2],u:U+K[ck][1]};tipo='cert'}}}
  else if(b==='b3'){if(hs<=2||nivel===0&&R.momento==='base'){main={n:t.f,p:'preço a confirmar',u:''};tipo='formacao'}else{main={n:MBA[t.mba][0],p:MBA[t.mba][1],u:''};tipo='mba'}}
  else{if(hs<=2){main={n:t.f,p:'preço a confirmar',u:''};tipo='formacao'}else{main={n:PRIME[0],p:PRIME[1],u:''};tipo='prime'}}
  var mot=['Porque '+MOM[R.momento]+' e precisa '+DES[R.desafio]+' nos próximos 3 meses.'];
  mot.push({gratis:'Dá para começar hoje sem gastar nada. A trilha abaixo mostra o que vem depois.',curso:'É o curso da trilha que ataca direto o que você precisa resolver, e cabe no bolso que você informou.',cert:'Uma certificação resolve o problema de agora e fica no currículo.',formacao:'A formação reúne os cursos da trilha em sequência. No seu ritmo, é mais realista terminar uma formação do que um MBA.',mba:'Você tem tempo e orçamento para uma formação longa, que cobre a carreira inteira e não só uma ferramenta.',prime:'Com esse orçamento, a assinatura dá acesso a vários MBAs e cursos. Só compensa seguindo a trilha abaixo, um curso por vez.'}[tipo]);
  if(hs<=2&&(b==='b3'||b==='b4'))mot.push('Com até 2 horas por semana, um MBA tende a ficar pela metade. Por isso a recomendação é a formação.');
  if(nivel===2)mot.push('Na sua posição, o ganho maior está em aplicar com a equipe, não só em aprender a ferramenta.');
  return {t:t,nivel:nivel,main:main,tipo:tipo,ordem:ordem,horas:horas,semanas:semanas,mot:mot,hs:hs};
}
function resultado(){
  var r=recomendar(),t=r.t,m=r.main,h='',alvo=Math.min(2,r.nivel+(R.cargo==='n0'?0:1));if(R.cargo==='n0')alvo=0;
  h+='<div class="res-top">'+compass(t.ang,true)+'<div><span class="tag">Seu norte</span><h1 style="font-size:clamp(28px,4vw,40px);margin-top:6px">'+t.n+'</h1><p style="margin:8px 0 0;color:var(--ink-2)">A bússola aponta a direção. O mapa abaixo mostra o próximo degrau e o que estudar para chegar nele.</p></div></div>';
  h+='<h3 style="font-size:22px;margin-top:22px">Seu mapa de carreira</h3><div class="escada">'+t.deg.map(function(d,i){var c=i===alvo?'alvo':(i===r.nivel&&R.cargo!=='n0'&&alvo!==i?'voce':'');return '<div class="deg '+c+'"><small>'+(c==='alvo'?(R.cargo==='n0'?'Sua porta de entrada':alvo===r.nivel?'Você está aqui: consolidar':'Seu próximo degrau'):c==='voce'?'Você está aqui':'Degrau '+(i+1))+'</small>'+d+'</div>'}).join('')+'</div><p class="note">Degraus típicos da carreira, montados para este protótipo. Para salários e trajetórias reais por cargo, veja o <a href="https://www.vagas.com.br/mapa-de-carreiras/cargos/" target="_blank" rel="noopener">Mapa de Carreiras da Vagas.com</a>.</p>';
  h+='<div class="norte"><span class="tag">Recomendação principal</span><h2>'+m.n+'</h2><span class="price">'+m.p+'</span><ul class="why">'+r.mot.map(function(x){return '<li>'+x+'</li>'}).join('')+'</ul>'+(m.u?'<a class="btn primary" href="'+m.u+'" target="_blank" rel="noopener">Ver o curso</a>':'')+'</div>';
  h+='<h3 style="font-size:22px;margin-top:26px">Sua trilha: '+t.f+'</h3><div class="chips"><span>'+t.c.length+' cursos</span><span>'+r.horas+' horas</span><span>cerca de '+r.semanas+' semanas a '+r.hs+' h por semana</span></div><table class="trilha"><tbody>'+r.ordem.map(function(k,i){var c=K[k];return '<tr'+(i===0?' class="first"':'')+'><td>'+(i+1)+'.</td><td>'+(c[1]?'<a href="'+U+c[1]+'" target="_blank" rel="noopener">'+c[0]+'</a>':c[0])+(i===0?' · primeiro da trilha':'')+'</td><td class="h">'+(c[3]?c[3]+' h':'')+'</td><td class="p">'+(c[2]||'')+'</td></tr>'}).join('')+'</tbody></table>';
  var cert=K[t.cert],mb=MBA[t.mba];
  h+='<div class="alt"><div><b>Depois da trilha:</b> '+(r.tipo==='mba'?cert[0]+' ('+cert[2]+')':mb[0]+' ('+mb[1]+')')+', quando você estiver mirando o degrau seguinte.</div><div><b>Se o bolso apertar:</b> faça só o primeiro curso da trilha e volte quando puder. O que trava a maioria dos alunos é dinheiro e tempo, não capacidade.</div></div>';
  h+='<p class="note" style="margin-top:16px">A Bússola indica o que estudar para o próximo degrau. Ela não promete promoção nem emprego.</p>';
  h+='<div class="acts"><button class="btn small" id="again">Refazer</button><button class="btn small" id="print">Imprimir ou salvar em PDF</button><a class="btn small" id="wa" target="_blank" rel="noopener">Enviar para mim no WhatsApp</a></div>';
  $('app').innerHTML=h;
  $('again').onclick=function(){R={};step=-1;render()};$('print').onclick=function(){window.print()};
  $('wa').href='https://wa.me/?text='+encodeURIComponent('Minha Bússola de Carreira FM2S\nNorte: '+t.n+'\nPróximo degrau: '+t.deg[alvo]+'\nComeçar por: '+m.n+' ('+m.p+')\nTrilha: '+t.f+', '+r.horas+' h, cerca de '+r.semanas+' semanas');
}
function render(){
  if(step<0){$('app').innerHTML='<div class="hero"><div><span class="tag">Para alunos e ex-alunos</span><h1 style="margin-top:8px">São mais de 150 cursos. Você só precisa do próximo degrau.</h1><p>Responda 7 perguntas sobre onde você está e para onde quer ir. Você recebe o seu mapa de carreira, por onde começar e a trilha completa, com horas e preço.</p><button class="btn primary" id="go">Encontrar meu norte</button></div>'+compass(null)+'</div>';$('go').onclick=function(){step=0;render()};return}
  if(step>=Q.length){resultado();return}
  var q=Q[step],h='<span class="tag">Pergunta '+(step+1)+' de '+Q.length+'</span><div class="prog"><i style="width:'+(step/Q.length*100)+'%"></i></div><div class="q"><h2>'+q.t+'</h2><p class="sub">'+(q.s||'&nbsp;')+'</p><div class="opts">'+q.o.map(function(o){return '<button class="opt" data-v="'+o[0]+'">'+o[1]+(o[2]?'<small>'+o[2]+'</small>':'')+'</button>'}).join('')+'</div></div><div class="nav"><button class="btn small" id="back">Voltar</button><span class="note">Nenhum dado é salvo neste protótipo.</span></div>';
  $('app').innerHTML=h;
  Array.prototype.forEach.call(document.querySelectorAll('.opt'),function(b){b.onclick=function(){R[q.k]=b.getAttribute('data-v');step++;render();window.scrollTo(0,0)}});
  $('back').onclick=function(){step--;render()};
}
window.__rec=function(r){R=r;var x=recomendar();return {m:x.main.n,tipo:x.tipo,h:x.horas,o:x.ordem.length}};
render();
})();
</script>
